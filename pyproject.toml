[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-posture-rep-assistant"
version = "0.1.0"
description = "Multi-agent AI workout tracker for squat rep counting, posture fault detection, and AI-generated coaching."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["server"]
include = ["agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "server"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=agents",
    "--cov=main",
    "--cov-report=term-missing",
    "--cov-report=html",
]
